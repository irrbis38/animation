<!DOCTYPE html>
<html class="p-page" lang="ru">
    <head>
        <meta charset="utf-8">
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Играть в мафию с друзьями онлайн и бесплатно | Polemica</title>
        <meta name="description" content="Лучшие условия для игры в Мафию на сайте Polemica">
        <meta property="og:url" content="http://polemicagame.com/">
        <meta property="og:type" content="website">
        <meta property="og:title" content="">
        
        <link rel="stylesheet" href="../index.css">
    </head>
    <body class="p-page__body">
        



  <main class="p-main"> <div class="p-ui-kit">
  <div class="p-ui-kit__container">

    


    <button class="p-btn-large p-btn-pink">
      <span class="p-btn-large-inner">
        <img src="../images/ui-kit/icon-copy.svg" alt="">
        <span>Скопировать ссылку</span>
      </span>
    </button>

    

    <div class="p-ui-kit__wrapper">

      


      <div class="p-play__profile-panel">

        <div class="p-play__profile-modes">


          

            <label class="p-play__profile-modes-item">

              <input type="checkbox" class="p-play__profile-modes-input p-hidden-input">

              <span class="p-play__profile-modes-fake">

                <span class="p-play__profile-modes-checkbox"></span>

                <span class="p-play__profile-modes-info">

                  <span class="p-play__profile-modes-name">Обычный</span>

                  <span class="p-play__profile-modes-amount">
                    <span>4</span>/10
                  </span>

                </span>


              </span>

            </label>

          

            <label class="p-play__profile-modes-item">

              <input type="checkbox" class="p-play__profile-modes-input p-hidden-input">

              <span class="p-play__profile-modes-fake">

                <span class="p-play__profile-modes-checkbox"></span>

                <span class="p-play__profile-modes-info">

                  <span class="p-play__profile-modes-name">Культурный</span>

                  <span class="p-play__profile-modes-amount">
                    <span>2</span>/10
                  </span>

                </span>


              </span>

            </label>

          

            <label class="p-play__profile-modes-item">

              <input type="checkbox" class="p-play__profile-modes-input p-hidden-input">

              <span class="p-play__profile-modes-fake">

                <span class="p-play__profile-modes-checkbox"></span>

                <span class="p-play__profile-modes-info">

                  <span class="p-play__profile-modes-name">Без цензуры</span>

                  <span class="p-play__profile-modes-amount">
                    <span>2</span>/10
                  </span>

                </span>


              </span>

            </label>

          


        </div>


        <div class="p-play-profile__wr">

          <button class="p-play__profile-button" type="button">
            <span>Играть</span>
          </button>

        </div>

      </div>

    </div>

    

    <div class="p-ui-kit__wrapper--player">

      <div class="p-player-item">

        <img src="../images/ui-kit/player.webp" alt="" class="p-player-item__media">

        <div class="p-player-item__wr">

          <div class="p-player-item__buttons">

            <button class="p-player-item__btn p-player-item__btn--peaceful" aria-label="Мирный">

              <span class="p-player-item__btn-wr">
                <img class="p-player-item__btn-icon" src="../images/ui-kit/role-peaceful.svg" alt="">
                <span class="p-player-item__btn-name">Мирный</span>
              </span>

            </button>

            <button class="p-player-item__btn p-player-item__btn--mafia" aria-label="Мафия">

              <span class="p-player-item__btn-wr">
                <img class="p-player-item__btn-icon" src="../images/ui-kit/role-mafia.svg" alt="">
                <span class="p-player-item__btn-name">Мафия</span>
              </span>

            </button>

          </div>

          <div class="p-player-item__info">

            <span class="p-player-item__info-number">2</span>

            <span class="p-player-item__info-name">Нагибатор4000</span>

          </div>

        </div>

      </div>


    </div>


    

    <button class="p-twich-button">
      <span>Смотреть на Twitch</span>
    </button>


    

    <button class="p-cta-button-blue" type="button" aria-label="в телеграм">
      <span>Перейти</span>
    </button>


    

    <button class="p-start-game-button-white" type="button" aria-label="Начать игру">
      <span>Начать играть сейчас</span>
    </button>


    

    <button type="button" class="p-main-play-button">
      <span>Играть сейчас</span>
    </button>

    

    <button type="button" class="p-lobby-play-button-grey">
      <span>Играть</span>
    </button>

    

    <button type="button" class="p-lobby-play-button-green">
      <span>Играть</span>
    </button>

    

    <button type="button" class="p-lobby-play-button-purple">
      <span>Смотреть</span>
    </button>

    

    <button class="p-profile-button" type="button">

      <span>
        Профиль
        <img src="../images/play/arrow-circle-right.svg" alt="" decoding="async" width="18" height="18">
      </span>

    </button>

    

    <button class="p-create-lobby-button">

      <span class="p-create-lobby-button__inner">
        <img src="../images/p-profile-plus.svg" alt="plus">
        <span class="p-lobby-button-text-desktop">Создать лобби</span>
        <span class="p-lobby-button-text-mobile">Создать</span>
      </span>

    </button>

    

    <div class="p-play__profile-friends">

      <div class="p-play__profile-friends-list">

        

        <div class="p-play__profile-friends-item p-play__profile-friends-added">

          <button class="p-btn p-play__profile-friends-add" type="button" aria-label="Добавить"></button>

          <div class="p-play__profile-friends-avatar">
            <img src="../images/cultural/mr_Steel.webp" alt="" class="p-play__profile-friends-img">
          </div>

          <div class="p-play__profile-friends-info">

            <span class="p-play__profile-friends-name">mr_Steel</span>

            <div class="p-play__profile-friends-rank">

              <img src="../images/cultural/icon-rank-gold.webp" alt="" class="p-play__profile-rank-icon">

              <span class="p-play__profile-friends-value p-play__participants-rating--gold">6,952</span>

            </div>

          </div>

        </div>

        

        <div class="p-play__profile-friends-item p-play__profile-friends-added">

          <button class="p-btn p-play__profile-friends-add" type="button" aria-label="Добавить"></button>

          <div class="p-play__profile-friends-avatar">
            <img src="../images/cultural/Takito.webp" alt="" class="p-play__profile-friends-img">
          </div>

          <div class="p-play__profile-friends-info">

            <span class="p-play__profile-friends-name">Takito</span>

            <div class="p-play__profile-friends-rank">

              <img src="../images/cultural/icon-rank-gold.webp" alt="" class="p-play__profile-rank-icon">

              <span class="p-play__profile-friends-value p-play__participants-rating--gold">6,952</span>

            </div>

          </div>

        </div>

        

        <div class="p-play__profile-friends-item">

          <button class="p-btn p-play__profile-friends-add" type="button" aria-label="Добавить"></button>

          <div class="p-play__profile-friends-avatar">
            <img src="#" alt="" class="p-play__profile-friends-img">
          </div>

          <div class="p-play__profile-friends-info">

            <span class="p-play__profile-friends-name"></span>

            <div class="p-play__profile-friends-rank">

              <img src="#" alt="" class="p-play__profile-rank-icon">

              <span class="p-play__profile-friends-value"></span>

            </div>

          </div>

        </div>

      </div>

      


      <button class="p-btn p-play__profile-friends-clear" type="button" aria-label="Очистить"></button>

    </div>

    

    <div class="p-play__profile-game p-play__profile-game--search">

      <div class="p-play__profile-game-search-time">0:12</div>

      <div class="p-play__profile-game-search-title">Идёт поиск игры</div>

      <div class="p-play__profile-game-search-players">

        <span class="p-play__profile-players-amount-desktop">
          Игроков в очереди: 3/10
        </span>

        <span class="p-play__profile-players-amount-mobile">
          В очереди: 3/10
        </span>


        <span class="p-play__profile-game-search-delay">~5-10 мин</span>
      </div>


      <div class="p-play__profile-game-btn-wrapper">
        <button class="p-play__profile-game-search-close">
          <img src="../images/p-close.svg" alt="close">
        </button>
      </div>


    </div>

    

    <div class="p-ui-kit__wrapper">

      <div class="p-profileachiv__item">

        <div class="p-profileachiv__item-inner">
          <div class="p-profileachiv__item-icon">
            <img src="../images/profile/icon-achievement-1.webp" alt="" class="p-profileachiv__item-icon-img">
          </div>

          <div class="p-profileachiv__item-desc">
            <span class="p-profileachiv__item-desc-title">
              Первый шаг
            </span>
            <span class="p-profileachiv__item-desc-text">
              Сыграйте вашу первую игру
            </span>
          </div>
        </div>

      </div>

    </div>

    

    <div class="p-ui-kit__wrapper-settings">
      <button type="button" class="p-profileinfo__settings" aria-label="Настройки"></button>
    </div>

    

    <button class="p-settings-modal__reset-btn" type="reset" aria-label="Отменить изменения">
      <span>Отменить</span>
    </button>

    

    <button class="p-settings-modal__confirm-btn" type="submit" aria-label="Сохранить изменения">
      <span>Сохранить</span>
    </button>


  </div>

</div>
</main>




        <script src="../js/ui-kit.js"></script>

    </body>
</html>
